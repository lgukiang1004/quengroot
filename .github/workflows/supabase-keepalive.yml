# 🌙 Supabase 깨우기 — 무료 Supabase는 한동안 아무 요청이 없으면 잠들 수 있어서,
#    깃허브가 매일 한 번 대신 들러요. (저장소의 config.js에 넣은 주소·공개 키를 그대로 써요)
#    직접 해 보려면: 깃허브 저장소 → Actions → "Supabase 깨우기" → Run workflow
name: Supabase 깨우기
on:
  schedule:
    - cron: "23 13 * * *"   # 매일 한 번 (뉴욕 아침 8~9시쯤)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase에 한 번 들르기
        run: |
          URL=$(grep -oE 'supabaseUrl:[[:space:]]*"[^"]*"' config.js | sed -E 's/.*"([^"]*)"/\1/')
          KEY=$(grep -oE 'supabaseKey:[[:space:]]*"[^"]*"' config.js | sed -E 's/.*"([^"]*)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js에 Supabase 주소/키가 비어 있어요"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL%/}/rest/v1/site_settings?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase 응답: $CODE"
          if [ "$CODE" -ge 500 ] || [ "$CODE" = "000" ]; then echo "Supabase가 응답하지 않아요. 대시보드에서 프로젝트가 멈췄는지(Paused) 확인해 주세요"; exit 1; fi
